[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/subscribe"
  to = "/.netlify/functions/api/subscribe"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200